name: video-run
on:
  repository_dispatch:
    types: [video-run]
  workflow_dispatch:
    inputs:
      slug:
        description: "Video slug to render+publish from the repo (skip the agent). Empty = autopilot builds a new video."
        required: false
        default: ''
        type: string
      dry_run:
        description: "Run everything except Publish + the success report; the final MP4 is kept as a run artifact instead."
        required: false
        default: false
        type: boolean
      account:
        description: "Channel account for this run (kali-aja | ai-labs | cerpenek | sastra-mesin | upwayyy). Empty = kali-aja."
        required: false
        default: 'kali-aja'
        type: string

env:
  # Render shards = entries in jobs.render.strategy.matrix.shard (keep the two in sync).
  SHARDS: 4

concurrency:
  group: video-run-${{ github.event.client_payload.account || inputs.account || 'kali-aja' }}
  cancel-in-progress: false

# Default token is read-only; no job pushes to the repository.
permissions:
  contents: read

# build (agent + gates + bundle) -> render (N shards in parallel, video only) -> publish (concat + audio + upload)
# A run is scoped to ONE channel account (Kali Aja, AI Labs, Cerpenek or Sastra Mesin), selected by the trigger:
#   repository_dispatch client_payload.account, or workflow_dispatch input `account`.
# Publish/Slack secrets live in repo secrets + per-account environments (build and publish jobs
# reference the environment matching their account). Environment secrets override repo secrets of the
# same name; unset environment secrets fall back to repo secrets. The build job's published-video lookup
# is a step-scoped BUFFER_ACCESS_TOKEN only, written to /tmp and never into .env or the repo.
jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.account || github.event.client_payload.account || 'kali-aja' }}
    timeout-minutes: 180
    outputs:
      slug: ${{ steps.slug.outputs.slug || steps.manualslug.outputs.slug }}
      frames: ${{ steps.frames.outputs.frames }}
      account: ${{ steps.acct.outputs.account }}
      slot: ${{ steps.slot.outputs.slot }}
      slot_date: ${{ steps.slot.outputs.slot_date }}
      failed_step: ${{ steps.failed.outputs.step }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }} # the triggering commit: main for the cron, the chosen branch for manual runs
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Mark start for slug discovery
        id: marker
        if: github.event.inputs.slug == ''
        run: touch "$RUNNER_TEMP/.ci-start"

      - name: Preflight
        run: |
          # ubuntu-latest migrated to Ubuntu 26 — ffmpeg no longer preinstalled
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          node -v; npm -v
          which google-chrome ffmpeg

      # Autopilot-only: the agent needs the opencode CLI, which the hosted
      # runner doesn't have. Install latest v2 via the official installer.
      - name: Install opencode
        id: install
        if: github.event.inputs.slug == ''
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      # The agent gets a GEMINI_API_KEY and nothing else. The published-video lookup uses a step-scoped
      # BUFFER_ACCESS_TOKEN and writes only public metadata to /tmp; no .env or repo data is used.
      # Publish secrets are written in the publish job, AFTER the build, so the agent never sees them.

      # Manual path (workflow_dispatch -f slug=<slug>): the video is already
      # committed; skip the agent and refuse to republish or run half-built videos.
      - name: Validate manual slug
        id: manualslug
        if: github.event.inputs.slug != ''
        env:
          SLUG_INPUT: ${{ github.event.inputs.slug }}
        run: |
          set -e
          SLUG="$SLUG_INPUT"
          [[ "$SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "slug fails charset check: $SLUG"; exit 1; }
          [ -d "src/videos/$SLUG" ] || { echo "src/videos/$SLUG does not exist"; exit 1; }
          [ -f "src/videos/$SLUG/timeline.json" ] || { echo "timeline.json missing for $SLUG"; exit 1; }
          [ -f "src/videos/$SLUG/publish.json" ] || { echo "publish.json missing for $SLUG"; exit 1; }
          [ -f "public/$SLUG/vo.mp3" ] || { echo "public/$SLUG/vo.mp3 missing"; exit 1; }
          # No generated video source/VO is committed.
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Dependencies
        run: npm ci

      # Fix the publish slot (pagi/siang/malam + WIB date) at run start, so a slow run
      # never drifts into the next slot's air times (YouTube is capped at 2/day by Buffer free).
      - name: Publish slot
        id: slot
        shell: bash # pipefail: a failing slot.mts must fail here, not hours later in publish
        env:
          ACCOUNT: ${{ inputs.account || github.event.client_payload.account || 'kali-aja' }}
        run: npx tsx scripts/slot.mts --account "$ACCOUNT" | tee -a "$GITHUB_OUTPUT"

      # Resolve the account: sets ACCOUNT, ACCOUNT_LABEL, BRAND_LINE, YOUTUBE_CATEGORY_ID,
      # AGENT_MODEL, AGENT_FILES, AGENT_PROMPT, CATALOG_PATH. Fails fast — before the agent and
      # before any render — when the account's Buffer config still holds TODO_ placeholders.
      # Credentials (GEMINI_API_KEY, keys, tokens) are NOT listed here: the job `environment:`
      # resolves them from GitHub, overriding repo secrets per-name or falling back to them.
      - name: Resolve account
        id: acct
        env:
          ACCOUNT: ${{ inputs.account || github.event.client_payload.account || 'kali-aja' }}
        run: |
          set -e
          npx tsx scripts/account-env.mts --account "$ACCOUNT" --require-configured >> "$GITHUB_ENV"
          echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"

      # The agent gets a GEMINI_API_KEY and nothing else. The environment already picked the
      # account's key (or the repo fallback).
      - name: Write agent .env
        if: github.event.inputs.slug == ''
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          umask 077
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env

      - name: Fetch published-video catalog from Buffer
        id: catalog
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: npx tsx scripts/fetch-published-videos.mts --account "$ACCOUNT" --out "$CATALOG_PATH"

      - name: Agent builds the video
        id: agent
        if: github.event.inputs.slug == ''
        # Isolate the agent from the hosted runner's global opencode config (~/.config/opencode):
        # its claude-mem plugin injected memories of the previous run ("video committed, tree clean"),
        # so the agent re-verified the old video and produced nothing new.
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/opencode-config"
          export OPENCODE_DISABLE_CLAUDE_CODE=1
          mkdir -p "$XDG_CONFIG_HOME"
          # The agent may fail only after writing a complete, verified video (for example after an
          # unsupported interactive Web Search request). Do not throw that work away here. The
          # downstream Discover/Gates/Still/Upload/Publish checks remain the authority and will
          # reject incomplete or broken output.
          read -ra FILES <<< "$AGENT_FILES"
          ARGS=()
          for f in "${FILES[@]}"; do ARGS+=(--file "$f"); done
          set +e
          "$HOME/.opencode/bin/opencode" run --auto --standalone --model "$AGENT_MODEL" "${ARGS[@]}" "$AGENT_PROMPT" 2>&1 | tee /tmp/opencode-agent.log
          AGENT_STATUS=${PIPESTATUS[0]}
          if [ "$AGENT_STATUS" -ne 0 ]; then
            echo "::warning title=Agent exited $AGENT_STATUS::agent exited non-zero; relying on deterministic downstream gates"
          fi
          exit 0

      # Slug candidates = folders under src/videos created since the marker.
      # Fail on ZERO or MULTIPLE candidates; validate the slug charset so it can
      # be safely interpolated downstream.
      - name: Discover slug
        id: slug
        if: github.event.inputs.slug == ''
        run: |
          set -e
          CANDIDATES="$(find src/videos -mindepth 1 -maxdepth 1 -type d -newer "$RUNNER_TEMP/.ci-start" -printf '%f\n')"
          N="$(printf '%s\n' "$CANDIDATES" | grep -c . || true)"
          if [ "$N" -eq 0 ]; then echo "agent produced no new video folder"; exit 1; fi
          if [ "$N" -gt 1 ]; then echo "ambiguous slug (multiple new folders):"; echo "$CANDIDATES"; exit 1; fi
          SLUG="$CANDIDATES"
          [[ "$SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "slug fails charset check: $SLUG"; exit 1; }
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      # The video must belong to this run's account and carry its brand. Runs on both paths
      # (autopilot build and manual render+publish of a committed video).
      - name: Account gate
        id: accountgate
        run: npx tsx scripts/account-gate.mts --account "$ACCOUNT" --slug "$SLUG"

      # Deterministic near-duplicate gate: fail before music/render/publish when the candidate
      # topic/title is too close to anything previously published, using the Buffer snapshot from this job.
      - name: Duplicate gate
        id: duplicates
        run: npx tsx scripts/check-duplicates.mts "$SLUG" --db "$CATALOG_PATH"

      # music.wav is gitignored and synthesized by predev/prerender, which the direct
      # `npx remotion bundle` below never triggers — synthesize it here or the render 404s on the asset.
      - name: Generate music bed (missing only)
        run: npx tsx scripts/music.mts --missing

      - name: Gates (lint + tests + sync + bundle)
        id: gates
        run: npm run lint && npm test && npm run check-sync -- "$SLUG" && npm run check-motion -- "$SLUG" && npx remotion bundle --out-dir /tmp/rbundle

      # One still per shot, ~0.5s into each shot (past transitions, capped at midpoint; fps=30 from src/Root.tsx).
      # Slug passed via env, not interpolated into the JS expression.
      - name: Still check (one frame per shot)
        id: stills
        run: |
          while read -r shot frame; do
            npx remotion still /tmp/rbundle "$SLUG" "/tmp/s_${shot}.jpg" --frame="$frame" --gl=swangle --image-format=jpeg
            SZ=$(stat -c%s "/tmp/s_${shot}.jpg")
            if [ "$SZ" -lt 10000 ]; then echo "still for shot $shot too small or missing ($SZ bytes)"; exit 1; fi
          done < <(node -e 'const fs=require("fs"); const t=JSON.parse(fs.readFileSync(`src/videos/${process.env.SLUG}/timeline.json`,"utf8")); console.log(t.shots.map(s=>s.id+" "+Math.max(1, Math.floor(Math.min(s.s+0.5, (s.s+s.e)/2)*30))).join("\n"));')

      # Must equal durationInFrames in src/Root.tsx: ceil(timeline.dur * 30).
      - name: Count frames
        id: frames
        run: |
          FRAMES=$(node -e 'const fs=require("fs"); const t=JSON.parse(fs.readFileSync(`src/videos/${process.env.SLUG}/timeline.json`,"utf8")); console.log(Math.ceil(t.dur*30));')
          [[ "$FRAMES" =~ ^[1-9][0-9]*$ ]] || { echo "bad frame count: $FRAMES"; exit 1; }
          echo "frames=$FRAMES" >> "$GITHUB_OUTPUT"

      # The bundle is self-contained (compiled video + public/ assets): render shards need nothing else.
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: /tmp/rbundle
          retention-days: 1
          if-no-files-found: error

      # publish.mts reads publish.json + naskah.txt from here.
      - name: Upload video metadata
        uses: actions/upload-artifact@v7
        with:
          name: meta
          path: |
            src/videos/${{ env.SLUG }}/publish.json
            src/videos/${{ env.SLUG }}/naskah.txt
          retention-days: 1
          if-no-files-found: error

      - name: Name the failing step
        id: failed
        if: failure()
        env:
          AGENT_O: ${{ steps.agent.outcome }}
          INSTALL_O: ${{ steps.install.outcome }}
          CATALOG_O: ${{ steps.catalog.outcome }}
          DUPLICATES_O: ${{ steps.duplicates.outcome }}
          SLUG_O: ${{ steps.slug.outcome }}
          MANUALSLUG_O: ${{ steps.manualslug.outcome }}
          GATES_O: ${{ steps.gates.outcome }}
          STILLS_O: ${{ steps.stills.outcome }}
          ACCT_O: ${{ steps.acct.outcome }}
          ACCOUNTGATE_O: ${{ steps.accountgate.outcome }}
        run: |
          for pair in "install:$INSTALL_O" "acct:$ACCT_O" "catalog:$CATALOG_O" "agent:$AGENT_O" "slug:$SLUG_O" "manualslug:$MANUALSLUG_O" "accountgate:$ACCOUNTGATE_O" "duplicates:$DUPLICATES_O" "gates:$GATES_O" "stills:$STILLS_O"; do
            if [ "${pair##*:}" = "failure" ]; then echo "step=${pair%%:*}" >> "$GITHUB_OUTPUT"; break; fi
          done

      # Hosted runners are ephemeral; keep cleanup anyway (harmless, and covers forks/self-hosted reuse).
      - name: Cleanup secrets
        if: always()
        run: rm -f .env

  # Video only (--muted): AAC cannot be joined gaplessly, so the sound is rendered once in `publish`.
  render:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SLUG: ${{ needs.build.outputs.slug }}
      FRAMES: ${{ needs.build.outputs.frames }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }} # the triggering commit: main for the cron, the chosen branch for manual runs
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Dependencies
        run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: bundle
          path: /tmp/rbundle

      # Contiguous, non-overlapping ranges that cover 0..FRAMES-1 exactly.
      - name: Render shard
        run: |
          set -e
          [[ "$SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "slug fails charset check: $SLUG"; exit 1; }
          FROM=$(( SHARD * FRAMES / SHARDS ))
          TO=$(( (SHARD + 1) * FRAMES / SHARDS - 1 ))
          echo "shard $SHARD: frames $FROM-$TO of $FRAMES"
          npx remotion render /tmp/rbundle "$SLUG" "out/chunk-$SHARD.mp4" --frames="$FROM-$TO" --muted --gl=swangle --concurrency=2 --log=error

      - uses: actions/upload-artifact@v7
        with:
          name: chunk-${{ matrix.shard }}
          path: out/chunk-${{ matrix.shard }}.mp4
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [build, render]
    runs-on: ubuntu-latest
    environment: ${{ needs.build.outputs.account }}
    timeout-minutes: 45
    outputs:
      failed_step: ${{ steps.failed.outputs.step }}
    env:
      SLUG: ${{ needs.build.outputs.slug }}
      FRAMES: ${{ needs.build.outputs.frames }}
      ACCOUNT: ${{ needs.build.outputs.account }}
      SLOT: ${{ needs.build.outputs.slot }}
      SLOT_DATE: ${{ needs.build.outputs.slot_date }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }} # the triggering commit: main for the cron, the chosen branch for manual runs
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Preflight
        run: |
          [[ "$SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "slug fails charset check: $SLUG"; exit 1; }
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Dependencies
        run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: bundle
          path: /tmp/rbundle

      - uses: actions/download-artifact@v7
        with:
          name: meta
          path: src/videos/${{ env.SLUG }}

      - uses: actions/download-artifact@v7
        with:
          pattern: chunk-*
          path: out
          merge-multiple: true

      # audioOnly skips the 3D scene (see Explainer.tsx): the whole soundtrack renders in well under a minute.
      - name: Render audio
        id: audio
        run: npx remotion render /tmp/rbundle "$SLUG" out/audio.wav --props="{\"videoId\":\"$SLUG\",\"audioOnly\":true}" --gl=swangle --log=error

      # Join the shards without re-encoding, add the soundtrack, normalise loudness — one pass.
      - name: Assemble + loudnorm
        id: assemble
        run: |
          set -e
          : > out/chunks.txt
          for i in $(seq 0 $(( SHARDS - 1 ))); do
            [ -s "out/chunk-$i.mp4" ] || { echo "missing out/chunk-$i.mp4"; exit 1; }
            echo "file 'chunk-$i.mp4'" >> out/chunks.txt
          done
          ffmpeg -y -v error -f concat -safe 0 -i out/chunks.txt -i out/audio.wav -map 0:v -map 1:a -c:v copy \
            -af loudnorm=I=-14:TP=-1.5:LRA=11 -ar 48000 -c:a aac -b:a 256k -movflags +faststart "out/$SLUG-final.mp4"
          GOT=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "out/$SLUG-final.mp4")
          [ "$GOT" = "$FRAMES" ] || { echo "assembled video has $GOT frames, expected $FRAMES"; exit 1; }
          ffprobe -v error -show_entries stream=codec_name,duration -of csv=p=0 "out/$SLUG-final.mp4"

      - name: Keep final MP4 (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: final-video
          path: out/${{ env.SLUG }}-final.mp4
          retention-days: 3

      - name: Slot (dry run)
        if: ${{ inputs.dry_run }}
        run: echo "would schedule slot=$SLOT date=$SLOT_DATE"

      # Video source is not committed; publishing fetches Buffer history directly.
      # The environment (needs.build.outputs.account) already resolved which secrets win per name —
      # Cloudinary/Buffer below are the account's values (or, if it unset them, the repo fallback).
      - name: Publish (Cloudinary → Buffer, scheduled)
        id: publish
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: npm run publish -- "$SLUG" --account "$ACCOUNT" --slot "$SLOT" --date "$SLOT_DATE"

      - name: Success report (Slack #social)
        if: ${{ success() && !inputs.dry_run }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SOCIAL_CHANNEL_ID: ${{ secrets.SLACK_SOCIAL_CHANNEL_ID }}
        run: npm run report -- "$SLUG" --account "$ACCOUNT"

      - name: Name the failing step
        id: failed
        if: failure()
        env:
          AUDIO_O: ${{ steps.audio.outcome }}
          ASSEMBLE_O: ${{ steps.assemble.outcome }}
          PUBLISH_O: ${{ steps.publish.outcome }}
        run: |
          for pair in "audio:$AUDIO_O" "assemble:$ASSEMBLE_O" "publish:$PUBLISH_O"; do
            if [ "${pair##*:}" = "failure" ]; then echo "step=${pair%%:*}" >> "$GITHUB_OUTPUT"; break; fi
          done

  # Fresh checkout, so the Slack token never shares a workspace with agent-written files.
  report-failure:
    needs: [build, render, publish]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }} # the triggering commit: main for the cron, the chosen branch for manual runs
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Dependencies
        run: npm ci

      - name: Failure report (Slack #social)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SOCIAL_CHANNEL_ID: ${{ secrets.SLACK_SOCIAL_CHANNEL_ID }}
          SLUG: ${{ needs.build.outputs.slug }}
          BUILD_R: ${{ needs.build.result }}
          RENDER_R: ${{ needs.render.result }}
          PUBLISH_R: ${{ needs.publish.result }}
          BUILD_STEP: ${{ needs.build.outputs.failed_step }}
          PUBLISH_STEP: ${{ needs.publish.outputs.failed_step }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACCOUNT: ${{ needs.build.outputs.account }}
        run: |
          # First failing job, refined to the step when that job reported one.
          if [ "$BUILD_R" != "success" ]; then FAILSTEP="${BUILD_STEP:-build}"
          elif [ "$RENDER_R" != "success" ]; then FAILSTEP=render
          else FAILSTEP="${PUBLISH_STEP:-publish}"; fi
          [[ "$SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]] || SLUG=ci
          # A run that died before the account was resolved stays channel-neutral instead of guessing Kali Aja.
          ACCT=""
          if [ -n "$ACCOUNT" ]; then ACCT="--account $ACCOUNT"; fi
          npm run report -- "$SLUG" $ACCT --step "$FAILSTEP" --error "run gagal di step $FAILSTEP — lihat $RUN_URL" || true
